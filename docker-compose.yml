version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: arborq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       arborq
      POSTGRES_USER:     arborq_user
      POSTGRES_PASSWORD: arborq_pass
    ports:
      - "5432:5432"
    volumes:
      - arborq-pgdata:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arborq_user -d arborq"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arborq-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/arborq
      SPRING_DATASOURCE_USERNAME: arborq_user
      SPRING_DATASOURCE_PASSWORD: arborq_pass
      APP_JWT_SECRET:             "6D5A7134743777217A25432A462D4A614E645267556B587032733576387839782F423F4428472B4B6250655368566D5970337336"
      APP_JWT_EXPIRATION_MS:      "86400000"
    ports:
      - "8080:8080"

  frontend:
    image: node:22-alpine
    container_name: arborq-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  arborq-pgdata:
