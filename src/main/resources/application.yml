app:
  jwt:
    secret: "6D5A7134743777217A25432A462D4A614E645267556B587032733576387839782F423F4428472B4B6250655368566D5970337336"
    expiration-ms: 86400000   # 24 h
server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/arborq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:arborq_user}
    password: ${SPRING_DATASOURCE_PASSWORD:arborq_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    com.arborq: DEBUG
    org.hibernate.SQL: WARN

# ─── Perfil de desarrollo ─────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/arborq_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop


